<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008080"><title>北京浮生记 · 网页版</title><link rel="icon" href="assets/DualListDemo.ico"><link rel="stylesheet" href="style.css"></head>
<body><main class="window" id="game-window">
<header class="titlebar"><span><img src="assets/DualListDemo.ico" alt=""> <span id="title">北京浮生记</span></span><span class="window-tools" aria-hidden="true">＿ □ ×</span></header>
<nav class="menubar" aria-label="游戏菜单"><details><summary>系统(S)</summary><div><button data-action="new">新游戏</button><button data-action="scores">高手排行</button><button data-action="settings">游戏设置</button><button data-action="exit">退出 / 提前结算</button></div></details><details><summary>重要场所(P)</summary><div><button data-action="bank">银行</button><button data-action="hospital">医院</button><button data-action="post">邮局</button><button data-action="rent">租房中介</button><button data-action="internet">网吧</button><button data-action="airport">首都机场</button></div></details><details><summary>帮助(H)</summary><div><a href="help.html" target="_blank" rel="noopener">原版游戏文档</a><button data-action="tip">日积月累</button><button data-action="story">故事介绍</button><button data-action="beijing">北京介绍</button><button data-action="about">关于北京浮生记</button><button data-action="declaration">特别声明</button></div></details><button data-action="sound" id="sound-toggle">♫ 声音开</button></nav>
<section class="trade">
<fieldset><legend>黑 市</legend><div class="listbox"><table id="market"><thead><tr><th scope="col" data-sort="name">商品</th><th scope="col" data-sort="price">黑市价格</th></tr></thead><tbody></tbody></table></div><p class="hint">选中商品买进 · 双击直接交易</p></fieldset>
<div class="trade-buttons"><label>买 进</label><button id="buy" data-action="buy">==&gt;</button><label>卖 出</label><button id="sell" data-action="sell">&lt;==</button></div>
<fieldset><legend>您的出租屋 <span id="space">0/100</span></legend><div class="listbox" id="house-drop"><table id="house"><thead><tr><th scope="col" data-sort="name">商品</th><th scope="col" data-sort="cost">买进价格</th><th scope="col" data-sort="qty">数量</th></tr></thead><tbody></tbody></table></div><p class="hint">买进价格为平均成本 · 可拖动商品交易</p></fieldset>
</section>
<section class="middle"><fieldset class="status"><legend>您的状态</legend><div class="meter"><label>现 金</label><output id="cash"></output></div><div class="meter"><label>存 款</label><output id="bank"></output></div><div class="meter"><label>欠 债</label><output id="debt" class="red"></output></div><div class="vitals"><label>健康 <output id="health"></output></label><label>名声 <output id="fame"></output></label></div></fieldset>
<fieldset class="map"><legend id="map-title">北京市地铁示意图</legend><div class="map-inner"><svg viewBox="0 0 600 210" preserveAspectRatio="none" aria-hidden="true"><path d="M270 30 H540 V175 H270 Z M30 102 H540" fill="none" stroke="#bd2626" stroke-width="6"/><path d="M30 112 H540" fill="none" stroke="#fff" stroke-width="2"/></svg><div id="locations"></div><button data-action="map" id="map-switch">我要逛京城</button><button data-action="boss" class="boss-button">老板来了</button><span id="current-location">请选择目的地</span></div></fieldset></section>
<section class="services"><button data-action="bank"><img src="assets/hand5.ico" alt="">银 行</button><button data-action="hospital"><img src="assets/hand3.ico" alt="">医 院</button><button data-action="post"><img src="assets/hand7.ico" alt="">邮 局</button><button data-action="rent"><img src="assets/hand4.ico" alt="">租房中介</button><button data-action="internet"><img src="assets/hand9.ico" alt="">网 吧</button></section>
<div class="ticker" aria-label="原版新闻"><div id="ticker"></div></div><footer><span id="day">第 0 / 40 天</span><span>郭祥昊 · Guoly 工作室 · v1.2.2 网页移植</span><button data-action="journal">日记</button></footer></main>
<p class="desktop-note">北京浮生记 · 原汁原味的四十天 <a href="https://github.com/cantoblanco/beijing_fushengji" target="_blank" rel="noopener">源代码 / GPL-2.0</a></p>
<dialog id="modal"><form id="dialog-form"><header class="titlebar"><span id="dialog-title"></span><button type="button" id="dialog-close" aria-label="关闭">×</button></header><div id="dialog-content"></div><div id="dialog-buttons"></div></form></dialog><noscript>请启用 JavaScript 后游玩。</noscript><script type="module" src="js/app.js"></script></body></html>
